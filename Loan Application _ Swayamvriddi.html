<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group Loan Application | Swayamvriddi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#17224F; --green:#4C9F32; --green-ink:#2F7220;
  --bg:#F2F5F9; --surface:#FFFFFF; --text:#1B2340; --muted:#566079; --line:#D3DAE8; --soft:#EAF0F7;
  --primary:#17224F; --on-primary:#FFFFFF; --accent:#2F7220; --err:#B3261E; --err-bg:#FCEDEC;
  --ring:rgba(76,159,50,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1325; --surface:#151D37; --text:#E8ECF8; --muted:#A3ADC9; --line:#2B3558; --soft:#1C2644;
    --primary:#5FB341; --on-primary:#0B1220; --accent:#7CCB5E; --err:#FF8A80; --err-bg:#3A1E24; --ring:rgba(124,203,94,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1325; --surface:#151D37; --text:#E8ECF8; --muted:#A3ADC9; --line:#2B3558; --soft:#1C2644;
  --primary:#5FB341; --on-primary:#0B1220; --accent:#7CCB5E; --err:#FF8A80; --err-bg:#3A1E24; --ring:rgba(124,203,94,.5);
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid var(--line);padding:2px;flex:none}
.brand b{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:22px;letter-spacing:.06em;color:var(--primary);font-weight:700;line-height:1.1}
:root[data-theme="dark"] .brand b{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b{color:var(--text)}}
.brand span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.top-tag{margin-left:auto;font-size:14px;color:var(--muted);text-align:right}
.top-tag strong{display:block;color:var(--text);font-weight:600}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:44px;align-items:start}
.side{position:sticky;top:20px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding-bottom:6px}
.steps li::before{content:"";position:absolute;left:15px;top:34px;bottom:-4px;width:2px;background:var(--line)}
.steps li.done::before{background:var(--green)}
.steps li:last-child::before{display:none}
.stp{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;border-radius:8px;min-height:40px}
.stp[disabled]{cursor:default}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);flex:none}
.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.cur .dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.stp span.t{font-size:15px;color:var(--muted)}
.cur .stp span.t{color:var(--text);font-weight:600}
.done .stp span.t{color:var(--text)}
.mprog{display:none}
.privacy{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.45;padding-top:16px;border-top:1px solid var(--line)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:clip}
.body{padding:32px 32px 8px}
.body h2{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.005em;outline:none}
.lede{color:var(--muted);margin:8px 0 26px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 16px}
.w6{grid-column:span 6}.w3{grid-column:span 3}.w2{grid-column:span 2}
.sub{grid-column:span 6;font-size:15px;font-weight:600;color:var(--text);padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.field{min-width:0;border:0;padding:0;margin:0}
label.lbl,.field>label,legend,.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;padding:0}
.opt{font-weight:400;color:var(--muted);margin-left:4px}
.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--surface);font-size:16px;transition:border-color .15s}
textarea.in{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
.in:hover{border-color:#9AA5C0}
.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.caps{text-transform:uppercase}
.in::placeholder{color:#8B94AD;text-transform:none}
.in[readonly],.in:disabled{background:var(--soft);color:var(--muted)}
.field.bad .in{border-color:var(--err);background:var(--err-bg)}
.affix{display:flex;align-items:stretch}
.affix>b{display:grid;place-items:center;padding:0 14px;border:1.5px solid var(--line);border-right:0;border-radius:10px 0 0 10px;background:var(--soft);font-weight:600;color:var(--muted)}
.affix .in{border-radius:0 10px 10px 0}
.field.bad .affix>b{border-color:var(--err)}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.err{margin:6px 0 0;font-size:13px;color:var(--err);font-weight:500;display:none}
.bad>.err,.bad .err{display:block}
.err::before{content:"! ";font-weight:700}

/* choices */
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choices label{position:relative;cursor:pointer}
.choices input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choices span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1.5px solid var(--line);border-radius:10px;font-weight:500;background:var(--surface);transition:background .15s,border-color .15s}
.choices input:checked+span{border-color:var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600}
.choices input:focus-visible+span{outline:3px solid var(--ring);outline-offset:2px}
.choices label:hover input:not(:checked)+span{border-color:#9AA5C0}
.choices.cards{display:grid;grid-template-columns:repeat(3,1fr)}
.field.bad .choices span{border-color:var(--err)}
.tenure{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.tenure .in{width:120px}
.field.bad .tenure .choices span{border-color:var(--line)}
.field.bad .tenure .choices input:checked+span{border-color:var(--primary)}
.bad .hint{display:none}

/* toggles */
.field>label.switch,.field>label.check,.switch,.check{margin:0;font-weight:500;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px;position:relative}
.switch input,.check input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:46px;height:26px;border-radius:99px;background:#9AA5C0;position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.track{background:var(--green)}
.switch input:checked+.track::after{transform:translateX(20px)}
.switch input:focus-visible+.track,.check input:focus-visible+.box{outline:3px solid var(--ring);outline-offset:2px}
.box{width:24px;height:24px;border:1.5px solid #9AA5C0;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--surface)}
.check input:checked+.box{background:var(--primary);border-color:var(--primary)}
.check input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--on-primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.bad .box{border-color:var(--err)}
.tlabel{font-weight:600}

/* photo */
.photo-row{display:flex;gap:18px;align-items:center}
.ph{width:96px;height:128px;border-radius:10px;border:1.5px dashed #9AA5C0;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.ph.has{border-style:solid;border-color:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:10px;border:1.5px solid transparent;font-weight:600;cursor:pointer;background:var(--primary);color:var(--on-primary);text-decoration:none;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.link{background:none;border:0;padding:6px 4px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.nav{display:flex;justify-content:space-between;gap:12px;padding:18px 32px;margin-top:28px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.nav .btn.primary-wide{min-width:160px}

/* review */
.rv{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.rv-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.rv-h h3{font-size:15px;font-weight:600}
dl.rv-l{margin:0;padding:6px 16px 10px;display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:0 16px}
.rv-l dt{color:var(--muted);font-size:14px;padding:6px 0}
.rv-l dd{margin:0;padding:6px 0;font-weight:500;overflow-wrap:anywhere}
.rv-l dd.empty{color:var(--muted);font-weight:400}
.rv-photo{width:60px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:14px;margin:6px 0 20px}
.note b{display:block;margin-bottom:4px}
.note ul{margin:6px 0 0;padding-left:18px}
details.decl{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 14px}
details.decl summary{cursor:pointer;font-weight:600;min-height:28px}
details.decl p{font-size:14px;color:var(--muted);margin:10px 0 0}
.done-box{text-align:center;padding:48px 28px 40px}
.tick{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 18px}
.done-box h2{margin-bottom:8px;font-family:"Source Serif 4",Georgia,serif;font-size:28px;line-height:1.2}
.done-box p{color:var(--muted);max-width:50ch;margin:0 auto 22px}
.done-box ol{text-align:left;max-width:46ch;margin:0 auto 26px;padding-left:20px;color:var(--text)}
.done-box .btns{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:14px;max-width:90vw;z-index:9;display:none}

.lender{border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
.lender.on{border-color:var(--primary)}
.lrow{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:6px 0 14px}
.lrow3{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:14px;padding:12px 0 8px}
.lender>.link{margin:0 0 10px -4px}
.loan-sum{font-weight:600;margin:16px 0 0}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:18px;padding:16px 14px 40px}
  .side{display:none}
  .mprog{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 12px}
  .mprog .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
  .mprog .row strong{color:var(--text)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
  .top-tag{display:none}
  .body{padding:22px 18px 4px}
  .body h2{font-size:26px}
  .nav{padding:14px 18px}
}
@media (max-width:560px){
  .lrow,.lrow3{grid-template-columns:1fr}
  .w3,.w2{grid-column:span 6}
  .choices.cards{grid-template-columns:repeat(2,1fr)}
  dl.rv-l{grid-template-columns:1fr;}
  .rv-l dt{padding-bottom:0}.rv-l dd{padding-top:0}
  .brand b{font-size:19px}.brand span{font-size:11px}
  .nav .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const fmtDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]}`:''};

/* ---------- formatters & validators ---------- */
const digits=n=>v=>v.replace(/\D/g,'').slice(0,n);
const inr=v=>{let s=v.replace(/\D/g,'').replace(/^0+/,'');if(!s)return'';if(s.length<=3)return s;return s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3)};
const aadhaarF=v=>v.replace(/\D/g,'').slice(0,12).replace(/(\d{4})(?=\d)/g,'$1 ');
const alnum=n=>v=>v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,n);
const num=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const words=n=>n>=1e7?(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' crore':n>=1e5?(n/1e5).toFixed(2).replace(/\.?0+$/,'')+' lakh':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+' thousand':'';
const V={
  phone:v=>/^[6-9]\d{9}$/.test(v)?'':'Enter a 10-digit mobile number starting with 6, 7, 8 or 9',
  pin:v=>/^[1-9]\d{5}$/.test(v)?'':'Enter a 6-digit PIN code',
  aadhaar:v=>/^[2-9]\d{11}$/.test(v.replace(/\s/g,''))?'':'Aadhaar has 12 digits and does not start with 0 or 1',
  pan:v=>/^[A-Z]{5}\d{4}[A-Z]$/.test(v)?'':'PAN looks like ABCDE1234F',
  voter:v=>/^[A-Z0-9]{6,12}$/.test(v)?'':'Check the Voter ID number',
  ifsc:v=>/^[A-Z]{4}0[A-Z0-9]{6}$/.test(v)?'':'IFSC looks like SBIN0001234 (11 characters)',
  account:v=>/^\d{9,18}$/.test(v)?'':'Account number has 9 to 18 digits',
  cheque:v=>/^\d{6}$/.test(v)?'':'Cheque number has 6 digits',
  amount:v=>{const n=num(v);return n>0&&n<=1e9?'':'Enter an amount above 0'},
  date:v=>/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v))?'':'Enter a valid date',
  alt:(v,d)=>v===d.mobile?'Alternative number should differ from the mobile number':V.phone(v),
  coalt:(v,d)=>v===d.coMobile?'Alternative number should differ from the mobile number':V.phone(v),
};

const LENDERS=['SIF','TATA Capital','Fusion','FinSigma','Grameen Quota','Bajaj','Satin','Keerthana'];
const INC={affix:'₹',im:'numeric',fmt:inr,caps:0,ac:'off',val:V.amount};
const OWN=d=>d.residence==='Self-owned'||d.residence==='Parental';
const loanList=()=>[...d.loans.filter(l=>l.on).map(l=>({n:l.name,e:l.emi,t:l.note})),...d.others.filter(o=>o.name.trim()||o.emi).map(o=>({n:o.name.trim(),e:o.emi,t:o.note}))];
const loanTotal=()=>loanList().reduce((a,l)=>a+num(l.e),0);
function loansErrors(d){
  const e={};if(!d.hasLoans)return e;
  if(!d.loans.some(l=>l.on)&&!d.others.length)e.loans='Tick at least one company or add one';
  d.loans.forEach((l,i)=>{if(l.on&&!(num(l.emi)>0))e['lk'+i]='Enter the monthly EMI'});
  d.others.forEach((o,i)=>{
    if(!o.name.trim())e['ok'+i+'n']='Enter the company name';
    else if(/[^\x20-\x7E]/.test(o.name+o.note))e['ok'+i+'n']='Use English letters and digits only';
    if(!(num(o.emi)>0))e['ok'+i+'e']='Enter the monthly EMI';
  });
  return e;
}

const vis=f=>!f.showIf||f.showIf(d);

function check(f){
  const raw=d[f.id];const v=(raw==null?'':String(raw)).trim();
  if(f.type==='tenure'){const n=num(d.tenure);const max=d.tenureUnit==='Years'?30:360;
    return n>=1&&n<=max?'':(d.tenure?`Enter 1 to ${max} ${d.tenureUnit.toLowerCase()}`:'Enter the tenure');}
  if(!v) return f.req?(f.msg||(f.type==='choice'?'Choose one option':`Enter ${f.label.toLowerCase()}`)):'';
  if((f.type==='text'||f.type==='area')&&/[^\x20-\x7E\n]/.test(v)) return 'Use English letters and digits only. The PDF cannot print other scripts.';
  return f.val?(f.val(v,d)||''):'';
}
function validateStep(i){
  const s=STEPS[i];let first=null;
  if(s.id==='loans')Object.keys(errs).forEach(k=>/^(lk|ok|loans)/.test(k)&&delete errs[k]);
  s.fields.forEach(f=>{
    if(['heading','toggle','check','photo','loans'].includes(f.type)||!vis(f))return;
    const e=check(f);if(e){errs[f.id]=e;if(!first)first=f.id}else delete errs[f.id];
  });
  if(s.extra){const x=s.extra(d);Object.keys(x).forEach(k=>{if(!errs[k]||s.id==='loans'){errs[k]=x[k];if(!first)first=k}})}
  return first;
}

const U=s=>(s==null?'':String(s)).trim().toUpperCase();
function fieldHTML(f){
  if(!vis(f))return'';
  const id=f.id,e=errs[id]||'',bad=e?' bad':'',w='w'+(f.w||6);
  if(f.type==='heading')return`<h3 class="sub">${esc(f.label)}</h3>`;
  if(f.type==='loans')return loansHTML();
  const opt=f.req===0?'<span class="opt">optional</span>':'';
  const err=`<p class="err" id="e-${id}" role="alert">${esc(e)}</p>`;
  const desc=`${f.hint?`h-${id} `:''}e-${id}`;
  if(f.type==='choice'){
    return`<fieldset class="field ${w}${bad}" id="w-${id}"><legend>${esc(f.label)}</legend><div class="choices ${f.cls||''}" role="radiogroup">${f.opts.map((o,k)=>`<label><input type="radio" id="r-${id}-${k}" name="${id}" value="${esc(o)}" data-id="${id}" ${d[id]===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>${err}</fieldset>`;
  }
  if(f.type==='toggle'){
    return`<div class="field ${w}"><label class="switch"><input type="checkbox" role="switch" id="f-${id}" data-id="${id}" ${d[id]?'checked':''}><span class="track"></span><span class="tlabel">${esc(f.label)}</span></label></div>`;
  }
  if(f.type==='check'){
    return`<div class="field ${w}"><label class="check"><input type="checkbox" id="f-${id}" data-id="${id}" ${d[id]?'checked':''}><span class="box"></span><span>${esc(f.label)}</span></label></div>`;
  }
  if(f.type==='photo'){
    const has=!!d[id];
    return`<div class="field ${w}"><span class="lbl">${esc(f.label)} <span class="opt">optional</span></span><div class="photo-row"><div class="ph ${has?'has':''}">${has?`<img src="${d[id]}" alt="${esc(f.who)} photo preview">`:`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`}</div><div><div class="btns"><input type="file" class="vh" id="f-${id}" accept="image/*" data-id="${id}"><label class="btn ghost sm" for="f-${id}">${has?'Replace photo':'Add photo'}</label>${has?`<button type="button" class="link" data-act="rm" data-id="${id}">Remove</button>`:''}</div><p class="hint" id="h-${id}">JPG or PNG. It is printed in the photo box on the form. Leave it empty to paste a printed photo.</p><p class="err" id="e-${id}" role="alert">${esc(e)}</p></div></div></div>`;
  }
  if(f.type==='tenure'){
    return`<div class="field ${w}${bad}" id="w-${id}"><label class="lbl" for="f-tenure">${esc(f.label)}</label><div class="tenure"><input class="in" id="f-tenure" data-id="tenure" inputmode="numeric" autocomplete="off" value="${esc(d.tenure)}" aria-describedby="e-tenure" placeholder="12"><div class="choices" role="radiogroup" aria-label="Tenure unit">${['Months','Years'].map(u=>`<label><input type="radio" name="tenureUnit" value="${u}" data-id="tenureUnit" ${d.tenureUnit===u?'checked':''}><span>${u}</span></label>`).join('')}</div></div>${err}</div>`;
  }
  const locked=f.lock&&d.sameAddr;
  const common=`id="f-${id}" data-id="${id}" aria-describedby="${desc}" ${e?'aria-invalid="true"':''} ${locked?'readonly':''} ${f.ac?`autocomplete="${f.ac}"`:''}`;
  let ctl;
  if(f.type==='select')ctl=`<select class="in" ${common}><option value="">Select</option>${f.opts.map(o=>`<option ${d[id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='area')ctl=`<textarea class="in caps" rows="3" ${common}>${esc(d[id])}</textarea>`;
  else{
    const inp=`<input class="in ${f.caps===0?'':'caps'}" type="${f.type==='date'?'date':f.tel?'tel':'text'}" ${f.im?`inputmode="${f.im}"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} value="${esc(d[id])}" ${common} ${f.type==='date'?`max="${today()}"`:''} spellcheck="false">`;
    ctl=f.affix?`<div class="affix"><b aria-hidden="true">${f.affix}</b>${inp}</div>`:inp;
  }
  const hint=id==='amount'?`<p class="hint" id="h-amount">${words(num(d.amount))?'About '+words(num(d.amount)):'Enter the amount in rupees'}</p>`:(f.hint?`<p class="hint" id="h-${id}">${esc(f.hint)}</p>`:'');
  return`<div class="field ${w}${bad}" id="w-${id}"><label class="lbl" for="f-${id}">${esc(f.label)}${opt}</label>${ctl}${hint}${err}</div>`;
}


function loanSumText(){const n=loanList().length;return n?`${n} ${n===1?'company':'companies'}, total monthly EMI ₹ ${inr(String(loanTotal()))}`:'No companies selected yet'}

function render(focusId){
  const s=STEPS[ui.step],card=$('#card');
  if(ui.done){card.innerHTML=doneHTML();renderSide();return}
  const last=ui.step===STEPS.length-1;
  let body=`<div class="body"><h2 id="h2" tabindex="-1">${s.title}</h2><p class="lede">${s.lede}</p>`;
  if(last){body+=reviewHTML()} else body+=`<div class="grid">${s.fields.map(fieldHTML).join('')}</div>`;
  body+=`</div><div class="nav">${ui.step>0?'<button type="button" class="btn ghost" data-act="back">Back</button>':'<span></span>'}<button type="submit" class="btn primary-wide">${last?'Generate PDF':'Continue'}</button></div>`;
  card.innerHTML=body;
  renderSide();
  if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}
}
function renderSide(){
  $('#steps').innerHTML=STEPS.map((s,i)=>{const cls=ui.done||i<ui.step||(i<ui.max&&i!==ui.step)?'done':'';
    return`<li class="${cls} ${i===ui.step&&!ui.done?'cur':''}"><button type="button" class="stp" data-act="goto" data-i="${i}" ${i>ui.max?'disabled':''} ${i===ui.step?'aria-current="step"':''}><span class="dot">${cls==='done'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>':i+1}</span><span class="t">${s.title}</span></button></li>`}).join('');
  const n=ui.done?STEPS.length:ui.step+1;
  $('#mprog').innerHTML=`<div class="row"><span>${ui.done?'Complete':`Step <strong>${n}</strong> of ${STEPS.length}`}</span><strong>${ui.done?'PDF ready':STEPS[ui.step].title}</strong></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${STEPS.length}" aria-valuenow="${ui.done?STEPS.length:ui.step}"><i style="width:${(ui.done?STEPS.length:ui.step+1)/STEPS.length*100}%"></i></div>`;
}
function doneHTML(){
  return`<div class="done-box"><div class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h2 class="serif" id="h2" tabindex="-1">Your application PDF is ready</h2><p>${esc(lastName)}</p><ol><li>Share or print the PDF.</li><li>Attach copies of the customer's identity and address proof.</li><li>Submit the application at the Swayamvriddi office.</li></ol><div class="btns"><button type="button" class="btn" data-act="redl">Download again</button><button type="button" class="btn ghost" data-act="editback">Edit details</button><button type="button" class="link" data-act="reset">Start a new application</button></div></div>`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4000)}
function showErr(id){
  const w=document.getElementById('w-'+id)||document.getElementById('f-'+id)?.closest('.field');if(!w)return;
  const e=errs[id]||'';w.classList.toggle('bad',!!e);
  const p=document.getElementById('e-'+id);if(p)p.textContent=e;
  const i=document.getElementById('f-'+id);if(i){e?i.setAttribute('aria-invalid','true'):i.removeAttribute('aria-invalid')}
}
function goStep(n,focusFirst){
  ui.step=n;ui.max=Math.max(ui.max,n);render();
  const h=$('#h2');if(h){h.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'})}
}

const card=$('#card');
function setVal(el,fn){
  const pos=el.selectionStart,sig=el.value.slice(0,pos).replace(/[ ,]/g,'').length;
  const nv=fn(el.value);if(nv===el.value)return;el.value=nv;
  if(document.activeElement===el){let n=0,i=0;for(;i<nv.length&&n<sig;i++)if(!/[ ,]/.test(nv[i]))n++;try{el.setSelectionRange(i,i)}catch(_){}}
}

  const el=e.target,id=el.dataset.id;
  if(el.dataset.lk!==undefined){
    const i=+el.dataset.lk,k=el.dataset.lf;if(k==='emi')setVal(el,inr);d.loans[i][k]=el.value;
    if(k==='emi'&&errs['lk'+i]&&num(el.value)>0){delete errs['lk'+i];showErr('lk'+i)}
    const ls=$('#loan-sum');if(ls)ls.textContent=loanSumText();return}
  if(el.dataset.ok!==undefined){
    const i=+el.dataset.ok,k=el.dataset.of;if(k==='emi')setVal(el,inr);d.others[i][k]=el.value;
    const key='ok'+i+(k==='name'?'n':'e');
    if(errs[key]&&(k==='name'?el.value.trim():num(el.value)>0)){delete errs[key];showErr(key)}
    const ls=$('#loan-sum');if(ls)ls.textContent=loanSumText();return}if(!id||el.type==='radio'||el.type==='checkbox'||el.type==='file')return;
  const f=fById(id);
  if(f&&f.fmt)setVal(el,f.fmt);
  else if(id==='tenure')setVal(el,digits(3));
  d[id]=el.value;
  if(id==='agentName'||id==='empCode'||id==='branch')saveAgent();
  if(id==='amount'){const h=$('#h-amount');if(h){const w=words(num(d.amount));h.textContent=w?'About '+w:'Enter the amount in rupees'}}
  if(errs[id]){const f2=f||{id,type:'tenure',label:'tenure',req:1};const e2=check(f2);if(!e2){delete errs[id];showErr(id)}}
});
card.addEventListener('focusout',e=>{
  const el=e.target,id=el.dataset&&el.dataset.id;if(!id||el.type==='radio'||el.type==='checkbox'||el.type==='file')return;
  const f=id==='tenure'?{id,type:'tenure',req:1}:fById(id);if(!f||(!d[id]&&!f.req&&id!=='tenure'))return;
  if(!String(d[id]||'').trim()&&!errs[id])return; // don't nag untouched empty fields
  const m=check(f);m?errs[id]=m:delete errs[id];showErr(id);
});
card.addEventListener('change',async e=>{
  const el=e.target,id=el.dataset.id;
  if(el.dataset.lk!==undefined&&el.dataset.lf==='on'){
    const i=+el.dataset.lk;d.loans[i].on=el.checked;delete errs.loans;delete errs['lk'+i];
    render(el.checked?'f-lk'+i:'c-lk'+i);return}
  if(!id)return;
  if(el.type==='radio'){d[id]=el.value;delete errs[id];if(id==='residence'){render('r-residence-'+fById('residence').opts.indexOf(el.value));return}showErr(id);return}
  if(el.type==='checkbox'){
    d[id]=el.checked;
    if(id==='hasCo'||id==='hasLoans'){render('f-'+id)}
    else if(id==='sameAddr'){
      if(el.checked){Object.assign(d,{coHouse:d.house,coStreet:d.street,coArea:d.area,coCity:d.city,coDistrict:d.district,coPin:d.pin});['coHouse','coStreet','coArea','coCity','coDistrict','coPin'].forEach(k=>delete errs[k])}
      render('f-sameAddr');
    } else if(id==='agree'){if(el.checked){delete errs.agree;showErr('agree')}}
    return;
  }
  if(el.type==='file'){
    const file=el.files&&el.files[0];if(!file)return;
    if(!/^image\//.test(file.type)){toast('Choose an image file (JPG or PNG).');return}
    try{d[id]=await processPhoto(file);render('f-'+id)}catch(_){toast('That image could not be read. Try a different photo.')}
    return;
  }
  if(el.tagName==='SELECT'){d[id]=el.value;if(el.value){delete errs[id];showErr(id)}}
});
card.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='back')goStep(ui.step-1);
  else if(a==='addother'){d.others.push({name:'',emi:'',note:''});delete errs.loans;render('f-ok'+(d.others.length-1)+'n')}
  else if(a==='rmother'){d.others.splice(+b.dataset.i,1);Object.keys(errs).forEach(k=>/^ok/.test(k)&&delete errs[k]);render()}
  else if(a==='goto'){const i=+b.dataset.i;if(i<=ui.max){ui.done=false;goStep(i)}}
  else if(a==='rm'){d[b.dataset.id]='';render('f-'+b.dataset.id)}
  else if(a==='redl')savePdf();
  else if(a==='editback'){ui.done=false;goStep(STEPS.length-1)}
  else if(a==='reset'){if(confirm('Clear all details and start a new application?'))location.reload()}
});
$('#steps').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="goto"]');if(!b||b.disabled)return;const i=+b.dataset.i;
  if(i<=ui.max){ui.done=false;goStep(i)}
});
card.addEventListener('submit',e=>{
  e.preventDefault();
  const first=validateStep(ui.step);
  if(first){
    render();
    const el=document.getElementById('f-'+first)||document.querySelector(`#w-${first} input`)||document.getElementById('f-tenure');
    if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center'})}
    return;
  }
  if(ui.step<STEPS.length-1){goStep(ui.step+1);return}
  // final: re-check every earlier step
  for(let i=0;i<STEPS.length-1;i++){if(validateStep(i)){toast(`Step ${i+1} needs a fix: ${STEPS[i].title}`);goStep(i);render();return}}
  generate();
});

function processPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const W=360,H=480,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,H);const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;
    x.drawImage(img,(W-w)/2,(H-h)*0.2,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.88))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
})}

let fitTxt;
async function savePdf(){
  if(!lastDoc)return;
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(_){}
  try{
    if(dl){await dl.save({filename:lastName,data:lastDoc.output('arraybuffer')});toast('PDF saved.')}
    else{lastDoc.save(lastName)}
  }catch(err){
    if(err&&err.code==='declined')toast('Download cancelled. Choose Download again when ready.');
    else{try{lastDoc.save(lastName)}catch(_){toast('Could not save the PDF here. Open this page in a full browser tab and try again.')}}
  }
}
async function generate(){
  if(!window.jspdf){toast('The PDF library did not load. Check your connection and try again.');return}
  try{
    lastDoc=buildPdf();
    const nm=(d.name||'applicant').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'applicant';
    lastName=`Group-Loan-Application_${nm}_${d.appDate}.pdf`;
  }catch(err){console.error(err);toast('Something went wrong while building the PDF. Review your entries and try again.');return}
  ui.done=true;render();const h=$('#h2');if(h){h.focus({preventScroll:true});window.scrollTo({top:0})}
  savePdf();
}
